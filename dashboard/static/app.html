<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__ASSISTANT_NAME__ Dashboard</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#07090f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="__ASSISTANT_NAME__">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #07090f;
      --surface: rgba(255,255,255,0.04);
      --border:  rgba(255,255,255,0.07);
      --accent:  #6366f1;
      --adim:    rgba(99,102,241,0.14);
      --text:    #dde3ed;
      --muted:   #5e6a7e;
      --green:   #22c55e;
      --gdim:    rgba(34,197,94,0.14);
    }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      flex-shrink: 0; display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      background: rgba(7,9,15,0.95);
    }
    .logo { font-size: 15px; font-weight: 700; letter-spacing: 6px; }
    .logo em { color: var(--accent); font-style: normal; }
    .pill {
      display: flex; align-items: center; gap: 6px; padding: 4px 11px;
      border-radius: 99px; background: var(--surface); border: 1px solid var(--border);
      font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--muted); transition: all 0.3s;
    }
    .pill.on { background: var(--gdim); border-color: rgba(34,197,94,0.3); color: var(--green); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
    .pill.on .dot { background: var(--green); animation: blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .spacer { flex: 1; }
    .enc-badge {
      font-size: 9px; font-weight: 700; letter-spacing: 1.5px; padding: 3px 8px;
      border-radius: 4px; display: none;
    }
    .enc-badge.on  { display: block; background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.25); color: var(--green); }
    .enc-badge.off { display: block; background: rgba(255,100,100,0.08); border: 1px solid rgba(255,100,100,0.2); color: #f87171; }
    .url { font-size: 10px; font-family: monospace; color: var(--muted); padding: 4px 9px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }

    /* ── FEED ── */
    main { flex: 1; overflow-y: auto; padding: 14px 16px 8px; display: flex; flex-direction: column; gap: 10px; }
    main::-webkit-scrollbar { width: 3px; }
    main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.55; animation: pop 0.18s ease; }
    @keyframes pop { from { opacity:0; transform:translateY(4px); } }
    .msg-j   { align-self:flex-start; background:var(--adim);   border:1px solid rgba(99,102,241,0.18); border-bottom-left-radius:4px; }
    .msg-u   { align-self:flex-end;   background:var(--surface); border:1px solid var(--border);        border-bottom-right-radius:4px; }
    .msg-sys { align-self:center; font-size:11px; color:var(--muted); padding:2px 0; background:transparent; border:none; letter-spacing:0.3px; }
    .lbl { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.45; margin-bottom:4px; }
    .msg-j .lbl { color:var(--accent); }
    .msg-u .lbl { color:var(--muted); text-align:right; }

    /* ── FILE CARD ── */
    .msg-file {
      align-self: flex-end;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; border-bottom-right-radius: 4px;
      padding: 11px 14px; display: flex; align-items: center; gap: 12px;
      max-width: 82%; animation: pop 0.18s ease;
    }
    .fc-icon { font-size: 26px; flex-shrink: 0; }
    .fc-meta { flex: 1; min-width: 0; }
    .fc-lbl  { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.45; color:var(--muted); margin-bottom:4px; }
    .fc-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fc-size { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .fc-bar-wrap { height: 3px; background: var(--border); border-radius: 2px; margin-top: 7px; overflow: hidden; }
    .fc-bar { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; transition: width 0.12s linear; }
    .fc-status { font-size: 10px; font-weight: 700; letter-spacing: 1px; flex-shrink: 0; color: var(--muted); }
    .fc-status.done { color: var(--green); }
    .fc-status.err  { color: #f87171; }
    .fc-dl { display:block; margin-top:6px; font-size:11px; color:var(--accent); text-decoration:none; font-weight:600; }
    .fc-dl:hover { opacity: 0.8; }

    /* ── FOOTER ── */
    footer { flex-shrink:0; padding:10px 14px; border-top:1px solid var(--border); background:rgba(7,9,15,0.95); display:flex; gap:8px; align-items:center; }
    #inp { flex:1; padding:11px 14px; background:var(--surface); border:1.5px solid var(--border); border-radius:12px; color:var(--text); font-size:14px; outline:none; transition:border-color 0.15s; }
    #inp:focus { border-color: var(--accent); }
    #inp::placeholder { color: var(--muted); }
    .btn { padding:11px 15px; border:none; border-radius:12px; font-size:11px; font-weight:700; letter-spacing:1.5px; cursor:pointer; transition:opacity 0.15s,transform 0.1s; }
    .btn:active { transform: scale(0.96); }
    .btn:hover  { opacity: 0.82; }
    .btn-send { background: var(--accent); color: #fff; }
    .btn-wake { background:var(--surface); border:1px solid var(--border); color:var(--muted); display:none; }
    .btn-wake.show { display:block; color:var(--green); border-color:rgba(34,197,94,0.35); }
    .btn-attach {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 11px 13px; font-size: 16px; line-height: 1; border-radius: 12px;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0;
    }
    .btn-attach:hover  { opacity: 0.82; border-color: var(--accent); color: var(--accent); }
    .btn-attach:active { transform: scale(0.96); }

    /* ── MIC BUTTON ── */
    #mic-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      padding: 11px 13px; font-size: 16px; line-height: 1; border-radius: 12px;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s, background 0.2s, border-color 0.2s;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    #mic-btn:hover  { opacity: 0.82; border-color: var(--accent); color: var(--accent); }
    #mic-btn:active { transform: scale(0.96); }
    #mic-btn.recording {
      background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.45); color: #ef4444;
      animation: mic-pulse 1s ease-in-out infinite;
    }
    #mic-btn.unsupported { opacity: 0.3; cursor: not-allowed; }
    @keyframes mic-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.65;transform:scale(0.97)} }

    /* ── NOTIFICATIONS ── */
    #notif-btn {
      position:relative; background:var(--surface); border:1px solid var(--border);
      color:var(--muted); padding:7px 11px; font-size:15px; line-height:1;
      border-radius:10px; cursor:pointer; flex-shrink:0;
    }
    #notif-badge {
      position:absolute; top:-5px; right:-5px; min-width:16px; height:16px;
      border-radius:99px; background:#f87171; color:#fff; font-size:10px;
      font-weight:700; line-height:16px; text-align:center; padding:0 4px;
      display:none;
    }
    #notif-panel {
      flex-shrink:0; border-bottom:1px solid var(--border);
      background:rgba(255,255,255,0.02); padding:12px 16px;
      max-height:55%; overflow-y:auto;
    }
    .np-head { font-size:10px; font-weight:700; letter-spacing:2px; color:var(--muted); margin-bottom:8px; }
    .np-sub { margin-top:14px; }
    #notif-state { font-size:14px; font-weight:600; }
    #notif-help { font-size:12px; color:var(--muted); line-height:1.6; margin-top:6px; display:none; }
    .np-actions { display:flex; gap:8px; margin-top:10px; }
    .np-off { background:var(--surface); border:1px solid var(--border); color:var(--muted); }
    .nq-item {
      display:flex; gap:10px; align-items:flex-start; padding:9px 11px;
      background:var(--surface); border:1px solid var(--border);
      border-radius:10px; margin-bottom:7px;
    }
    .nq-main { flex:1; min-width:0; }
    .nq-title { font-size:13px; font-weight:700; }
    .nq-body { font-size:13px; margin-top:2px; line-height:1.45; }
    .nq-when { font-size:10px; color:var(--muted); margin-top:3px; }
    .nq-x { background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; padding:2px 4px; flex-shrink:0; }
    .nq-empty { font-size:12px; color:var(--muted); }
    .nq-clear { background:var(--surface); border:1px solid var(--border); color:var(--muted); margin-top:2px; }
    .msg-notif {
      align-self:stretch; max-width:100%;
      background:rgba(99,102,241,0.1); border:1px solid rgba(99,102,241,0.35);
      border-radius:12px;
    }
    .msg-notif .lbl { color:var(--accent); opacity:0.85; }
    /* ── TOAST ── */
    #toast {
      position:fixed; top:66px; left:50%; transform:translateX(-50%) translateY(-8px);
      background:rgba(34,197,94,0.16); border:1px solid rgba(34,197,94,0.4);
      color:var(--green); font-size:12px; font-weight:700; letter-spacing:1px;
      padding:7px 18px; border-radius:99px;
      opacity:0; transition:opacity 0.22s,transform 0.22s;
      pointer-events:none; white-space:nowrap;
    }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div id="toast"></div>
  <header>
    <div class="logo">__BRAND__</div>
    <div class="pill" id="pill"><span class="dot"></span><span id="st">Connecting</span></div>
    <div class="enc-badge" id="enc">AES-GCM</div>
    <button id="notif-btn" title="Notifications">🔔<span id="notif-badge"></span></button>
    <div class="spacer"></div>
    <div class="url">__IP__:__PORT__</div>
  </header>
  <section id="notif-panel" style="display:none">
    <div class="np-head">NOTIFICATIONS</div>
    <div id="notif-state">Checking…</div>
    <p id="notif-help"></p>
    <div class="np-actions">
      <button class="btn btn-send" id="notif-enable" onclick="doEnableNotif()">ENABLE</button>
      <button class="btn np-off" id="notif-disable" onclick="doDisableNotif()">DISABLE</button>
    </div>
    <div class="np-head np-sub">MISSED</div>
    <div id="notif-queue"></div>
  </section>
  <main id="feed"></main>
  <footer>
    <input id="inp" placeholder="Send a command to __ASSISTANT_NAME__…" autocomplete="off">
    <label class="btn-attach" for="file-inp" title="Send file">📎</label>
    <input type="file" id="file-inp" multiple accept="*/*" style="display:none">
    <button id="mic-btn" onclick="doMic()" title="Voice command">🎤</button>
    <button class="btn btn-wake" id="wake" onclick="doWake()">WAKE</button>
    <button class="btn btn-send" onclick="doSend()">SEND</button>
  </footer>

  <script>
    // ── Auth — bearer token ───────────────────────────────────────────────────
    const _authToken  = sessionStorage.getItem('jarvis_token');
    const _sessionKey = sessionStorage.getItem('jarvis_key');

    if (!_authToken) {
      location.replace('/login');
    }

    function _authHeader() { return { 'Authorization': `Bearer ${_authToken}` }; }
    function _authFetch(url, opts = {}) {
      opts.headers = Object.assign({}, opts.headers, _authHeader());
      return fetch(url, opts);
    }

    // ── AES-256-GCM encryption (Web Crypto) ──────────────────────────────────
    //
    // WHAT CHANGED, AND WHY THE LIBRARY WENT WITH IT
    //   This used CryptoJS with AES-CBC and a key of SHA256(pairingKey+salt).
    //   Two problems, both on the server side of the same conversation:
    //
    //   CBC hides a message but does not authenticate it, so an attacker on the
    //   same network could alter the ciphertext and the assistant would act on
    //   whatever fell out. GCM refuses a message that has been touched.
    //
    //   One round of SHA-256 over an eight-character key is an offline search
    //   measured in seconds on a GPU. PBKDF2 at 200k rounds makes each guess
    //   about a hundred thousand times more expensive, and costs this page one
    //   derivation at pairing time.
    //
    //   Both are native in Web Crypto, so the 60 KB CryptoJS bundle is no
    //   longer needed. crypto.subtle exists only in a secure context, which is
    //   why the server now insists on HTTPS instead of quietly falling back.
    const _AES_SALT   = 'JARVIS-DASHBOARD-v1';
    const _KDF_ROUNDS = 200000;
    let _aesKey = null;

    async function _initCrypto(key) {
      if (!window.crypto || !crypto.subtle) return false;
      try {
        const enc  = new TextEncoder();
        const base = await crypto.subtle.importKey(
          'raw', enc.encode(key), 'PBKDF2', false, ['deriveKey']);
        _aesKey = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: enc.encode(_AES_SALT),
            iterations: _KDF_ROUNDS, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['encrypt']);
        return true;
      } catch { return false; }
    }

    async function _encrypt(plaintext) {
      if (!_aesKey) return null;
      try {
        // A fresh 12-byte nonce per message. Reusing one under the same key is
        // the single way to break GCM, so it is generated here and never
        // stored, cached or derived from anything.
        const nonce = crypto.getRandomValues(new Uint8Array(12));
        const ct    = new Uint8Array(await crypto.subtle.encrypt(
          { name: 'AES-GCM', iv: nonce },
          _aesKey, new TextEncoder().encode(plaintext)));
        const out = new Uint8Array(nonce.length + ct.length);
        out.set(nonce, 0);
        out.set(ct, nonce.length);
        let bin = '';
        for (const b of out) bin += String.fromCharCode(b);
        return btoa(bin);
      } catch { return null; }
    }

    let _encReady  = false;
    const encBadge = document.getElementById('enc');
    encBadge.textContent = 'AES-GCM';
    // Deriving the key is PBKDF2 over 200k rounds, so it is awaited rather than
    // done inline — on a phone that is a few hundred milliseconds, and blocking
    // the parse for it would stall the whole page.
    (async () => {
      _encReady = _sessionKey ? await _initCrypto(_sessionKey) : false;
      if (_encReady) {
        encBadge.className = 'enc-badge on';
      } else {
        encBadge.className = 'enc-badge off';
        encBadge.textContent = 'NO ENC';
      }
    })();

    // ── WebSocket ─────────────────────────────────────────────────────────────
    const feed  = document.getElementById('feed');
    const pill  = document.getElementById('pill');
    const stTxt = document.getElementById('st');
    const wake  = document.getElementById('wake');

    const _wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    const _wsUrl   = `${_wsProto}://${location.host}/ws?token=${encodeURIComponent(_authToken)}`;
    const ws       = new WebSocket(_wsUrl);

    ws.onopen    = () => { sys('Remote session active.'); toast('Connected to ARIA'); };
    ws.onclose   = () => sys('Connection lost — refresh to reconnect.');
    ws.onerror   = () => sys('Connection error.');
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'log')           append(m.speaker, m.text);
      if (m.type === 'status')        setStatus(m.state);
      if (m.type === 'wake')          sys('Wake word detected — connecting…');
      if (m.type === 'sys')           sys(m.text);
      if (m.type === 'file_received') _onFileReceived(m);
      if (m.type === 'notification')  showNotificationCard(m);
    };

    function setStatus(s) {
      if (s === 'active') {
        pill.className = 'pill on'; stTxt.textContent = 'Active'; wake.classList.remove('show');
      } else {
        pill.className = 'pill'; stTxt.textContent = 'Sleeping'; wake.classList.add('show');
      }
    }

    function append(speaker, text) {
      const d = document.createElement('div');
      if (speaker === 'jarvis') {
        d.className = 'msg msg-j';
        d.innerHTML = `<div class="lbl">ARIA</div>${esc(text)}`;
      } else {
        d.className = 'msg msg-u';
        d.innerHTML = `<div class="lbl">You</div>${esc(text)}`;
      }
      feed.appendChild(d);
      feed.scrollTop = feed.scrollHeight;
    }

    function sys(text) {
      const d = document.createElement('div');
      d.className = 'msg msg-sys'; d.textContent = text;
      feed.appendChild(d); feed.scrollTop = feed.scrollHeight;
    }

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── File helpers ──────────────────────────────────────────────────────────
    function _fileIcon(name) {
      const ext = (name.split('.').pop() || '').toLowerCase();
      if (['jpg','jpeg','png','gif','webp','heic','heif','avif','bmp','svg'].includes(ext)) return '🖼️';
      if (['mp4','mov','avi','mkv','webm','m4v','3gp'].includes(ext))                       return '🎬';
      if (['mp3','m4a','wav','flac','aac','ogg','opus'].includes(ext))                      return '🎵';
      if (['pdf'].includes(ext))                                                             return '📋';
      if (['doc','docx','txt','md','rtf','odt'].includes(ext))                              return '📝';
      if (['xls','xlsx','csv','ods'].includes(ext))                                         return '📊';
      if (['ppt','pptx','odp'].includes(ext))                                               return '📑';
      if (['zip','rar','7z','tar','gz','bz2','xz'].includes(ext))                          return '📦';
      if (['apk','exe','dmg','deb','rpm','msi'].includes(ext))                              return '⚙️';
      return '📎';
    }

    function _fmtSize(bytes) {
      if (bytes < 1024)             return bytes + ' B';
      if (bytes < 1024 * 1024)     return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 ** 3)       return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      return (bytes / 1024 ** 3).toFixed(2) + ' GB';
    }

    // ── File upload (phone → computer) ────────────────────────────────────────
    function _uploadFile(file) {
      const id = 'fc_' + Date.now() + '_' + Math.random().toString(36).slice(2);

      // Create file card in feed
      const card = document.createElement('div');
      card.className = 'msg-file';
      card.id = id;
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(file.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Sending</div>
          <div class="fc-name">${esc(file.name)}</div>
          <div class="fc-size">${_fmtSize(file.size)}</div>
          <div class="fc-bar-wrap"><div class="fc-bar" id="${id}_bar"></div></div>
        </div>
        <div class="fc-status" id="${id}_st">0%</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.setRequestHeader('Authorization', `Bearer ${_authToken}`);

      xhr.upload.onprogress = (e) => {
        if (!e.lengthComputable) return;
        const pct = Math.round(e.loaded / e.total * 100);
        const bar = document.getElementById(`${id}_bar`);
        const st  = document.getElementById(`${id}_st`);
        if (bar) bar.style.width = pct + '%';
        if (st)  st.textContent  = pct + '%';
      };

      xhr.onload = () => {
        const bar  = document.getElementById(`${id}_bar`);
        const st   = document.getElementById(`${id}_st`);
        const meta = card.querySelector('.fc-meta');
        const lbl  = card.querySelector('.fc-lbl');
        if (xhr.status === 200) {
          let savedName = file.name;
          try { savedName = JSON.parse(xhr.responseText).name || file.name; } catch {}
          const dlUrl = `/uploads/${encodeURIComponent(savedName)}?token=${encodeURIComponent(_authToken)}`;
          if (bar)  { bar.style.width = '100%'; bar.style.background = 'var(--green)'; }
          if (st)   { st.textContent = '✓'; st.className = 'fc-status done'; }
          if (lbl)  lbl.textContent = 'Sent';
          if (meta) meta.insertAdjacentHTML('beforeend',
            `<a class="fc-dl" href="${dlUrl}" download="${esc(savedName)}">⬇ Download back</a>`);
          toast('File sent!');
        } else {
          let errMsg = 'Upload failed';
          try { errMsg = JSON.parse(xhr.responseText).error || errMsg; } catch {}
          if (bar) bar.style.background = '#f87171';
          if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
          if (lbl) lbl.textContent = errMsg;
        }
      };

      xhr.onerror = () => {
        const st  = document.getElementById(`${id}_st`);
        const lbl = card.querySelector('.fc-lbl');
        if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
        if (lbl) lbl.textContent = 'Connection error';
      };

      const fd = new FormData();
      fd.append('file', file);
      xhr.send(fd);
    }

    // File received by another WebSocket client (e.g., second open tab)
    function _onFileReceived(m) {
      const dlUrl = `/uploads/${encodeURIComponent(m.name)}?token=${encodeURIComponent(_authToken)}`;
      const card  = document.createElement('div');
      card.className = 'msg-file';
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(m.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Received</div>
          <div class="fc-name">${esc(m.name)}</div>
          <div class="fc-size">${_fmtSize(m.size)}</div>
          <a class="fc-dl" href="${dlUrl}" download="${esc(m.name)}">⬇ Download</a>
        </div>
        <div class="fc-status done">✓</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      toast('File received on computer!');
    }

    // File input change handler
    document.getElementById('file-inp').addEventListener('change', function () {
      Array.from(this.files).forEach(_uploadFile);
      this.value = ''; // reset so the same file can be re-sent
    });

    // ── Commands ──────────────────────────────────────────────────────────────
    async function doSend() {
      const inp = document.getElementById('inp');
      const txt = inp.value.trim();
      if (!txt) return;
      inp.value = '';
      append('user', txt);
      const enc  = await _encrypt(txt);
      const body = enc ? { enc } : { text: txt };
      _authFetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    }

    function doWake() {
      sys('Sending wake signal…');
      _authFetch('/api/wake', { method: 'POST' });
    }

    document.getElementById('inp').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
    });

    // ── Toast ─────────────────────────────────────────────────────────────────
    let _toastTimer;
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
    }

    // ── Real-time Voice — PCM16 WebSocket → Gemini Live ──────────────────────
    const micBtn  = document.getElementById('mic-btn');
    let _voiceWs  = null;
    let _audioCtx = null;
    let _micStm   = null;
    let _audioNd  = null;

    function _micIdle() {
      micBtn.innerHTML = '🎤';
      micBtn.title     = 'Voice — tap to speak';
      micBtn.classList.remove('recording');
    }

    // Float32 PCM → resample to 16 kHz + convert to Int16
    function _f32toPcm16(f32, srcRate) {
      let s = f32;
      if (srcRate !== 16000) {
        const ratio = srcRate / 16000;
        const len   = Math.round(f32.length / ratio);
        s = new Float32Array(len);
        for (let i = 0; i < len; i++)
          s[i] = f32[Math.min(Math.round(i * ratio), f32.length - 1)];
      }
      const out = new Int16Array(s.length);
      for (let i = 0; i < s.length; i++)
        out[i] = Math.max(-32768, Math.min(32767, Math.round(s[i] * 32768)));
      return out.buffer;
    }

    function _showVoiceSetup() {
      if (document.getElementById('voice-setup')) return; // show once
      const origin = location.origin;
      const card = document.createElement('div');
      card.id = 'voice-setup';
      card.style.cssText = [
        'align-self:stretch', 'background:rgba(99,102,241,0.07)',
        'border:1px solid rgba(99,102,241,0.22)', 'border-radius:14px',
        'padding:16px 18px', 'font-size:13px', 'line-height:1.8',
        'animation:pop 0.18s ease'
      ].join(';');
      card.innerHTML =
        '<div style="font-weight:700;color:#818cf8;letter-spacing:.5px;margin-bottom:10px">🎤 One-time voice setup</div>' +
        '<ol style="padding-left:18px;color:#8899aa;margin:0;display:flex;flex-direction:column;gap:4px">' +
        '<li>Open a new tab → go to <span style="background:rgba(255,255,255,0.07);padding:1px 6px;border-radius:4px;font-family:monospace;font-size:12px">chrome://flags</span></li>' +
        '<li>Search: <strong style="color:#dde3ed">Insecure origins treated as secure</strong></li>' +
        '<li>Paste this URL into the box:<br><span id="flags-url" style="background:rgba(255,255,255,0.07);padding:2px 8px;border-radius:4px;font-family:monospace;font-size:11px;user-select:all;cursor:pointer">' + esc(origin) + '</span></li>' +
        '<li>Set to <strong style="color:#22c55e">Enabled</strong> → tap <strong style="color:#dde3ed">Relaunch</strong></li>' +
        '<li>Return here and tap 🎤</li>' +
        '</ol>';
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      // tap to copy
      card.querySelector('#flags-url').addEventListener('click', () => {
        navigator.clipboard?.writeText(origin).then(() => toast('URL copied!')).catch(() => {});
      });
    }

    async function doMic() {
      if (_voiceWs) { _stopVoice(); return; }

      if (!navigator.mediaDevices?.getUserMedia) {
        _showVoiceSetup();
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });
      } catch (e) {
        sys(e.name === 'NotAllowedError'
          ? 'Microphone denied — tap the address bar lock and allow microphone.'
          : 'Mic error: ' + e.message);
        return;
      }

      // 16 kHz context (fall back to native rate — _f32toPcm16 resamples)
      let ctx;
      try { ctx = new AudioContext({ sampleRate: 16000 }); }
      catch (_) { ctx = new AudioContext(); }
      if (ctx.state === 'suspended') await ctx.resume();

      const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(
        `${wsProto}://${location.host}/ws/phone-audio?token=${encodeURIComponent(_authToken)}`
      );
      ws.binaryType = 'arraybuffer';

      ws.onopen = async () => {
        const rate = ctx.sampleRate;
        const src  = ctx.createMediaStreamSource(stream);

        // AudioWorklet (modern) — runs in dedicated audio thread
        const wCode = `class J extends AudioWorkletProcessor{process(i){const c=i[0]?.[0];if(c)this.port.postMessage(c.slice());return true;}}registerProcessor('j',J);`;
        try {
          const burl = URL.createObjectURL(new Blob([wCode], { type: 'application/javascript' }));
          await ctx.audioWorklet.addModule(burl);
          URL.revokeObjectURL(burl);
          const nd = new AudioWorkletNode(ctx, 'j');
          // Buffer to 1024 samples (64 ms at 16 kHz) before sending —
          // matches PC mic chunk size, prevents queue flooding on the server.
          let _pbuf = [], _plen = 0;
          nd.port.onmessage = e => {
            const chunk = new Int16Array(_f32toPcm16(e.data, rate));
            _pbuf.push(chunk); _plen += chunk.length;
            if (_plen >= 1024) {
              const out = new Int16Array(_plen); let off = 0;
              for (const c of _pbuf) { out.set(c, off); off += c.length; }
              if (ws.readyState === 1) ws.send(out.buffer);
              _pbuf = []; _plen = 0;
            }
          };
          src.connect(nd);
          _audioNd = nd;
        } catch (_) {
          // ScriptProcessor fallback (deprecated, still works everywhere)
          const sp = ctx.createScriptProcessor(4096, 1, 1);
          sp.onaudioprocess = e => {
            if (ws.readyState === 1) ws.send(_f32toPcm16(e.inputBuffer.getChannelData(0), rate));
          };
          src.connect(sp); sp.connect(ctx.destination);
          _audioNd = sp;
        }

        micBtn.innerHTML = '⏹';
        micBtn.title     = 'Tap to stop';
        micBtn.classList.add('recording');
        sys('Voice live — speak now');
        toast('🎤 Live');
      };

      ws.onclose = () => { _stopVoice(); };
      ws.onerror = () => { sys('Voice connection failed.'); _stopVoice(); };

      _voiceWs  = ws;
      _audioCtx = ctx;
      _micStm   = stream;
    }

    function _stopVoice() {
      if (_audioNd)  { try { _audioNd.disconnect(); }  catch (_) {}; _audioNd  = null; }
      if (_audioCtx) { try { _audioCtx.close(); }      catch (_) {}; _audioCtx = null; }
      if (_micStm)   { _micStm.getTracks().forEach(t => t.stop()); _micStm = null; }
      if (_voiceWs)  {
        const w = _voiceWs; _voiceWs = null;
        if (w.readyState < 2) w.close();
      }
      _micIdle();
    }
    // ── Notifications (Web Push — core/notify.py) ─────────────────────
    // The states this panel can show are computed from what the
    // browser actually reports — support, install state, permission,
    // and a live subscription check against the service worker. A
    // state is never asserted from a click: ENABLE asks, then the
    // state is re-read, so what the panel says is what is true.
    //
    // iOS, plainly: Safari only delivers push to web apps installed
    // on the Home Screen (iOS 16.4+). In a plain Safari tab the
    // honest state is the install instruction, not an Enable button
    // whose subscribe call would fail.
    const notifPanel = document.getElementById('notif-panel');
    const notifState = document.getElementById('notif-state');
    const notifHelp  = document.getElementById('notif-help');
    const notifOn    = document.getElementById('notif-enable');
    const notifOff   = document.getElementById('notif-disable');
    const notifBadge = document.getElementById('notif-badge');
    const notifQueue = document.getElementById('notif-queue');
    let _swReg = null;

    const _IOS_INSTALL_HELP =
      'On iPhone, push notifications only work after this page is ' +
      'added to your Home Screen. Tap the Share button, choose ' +
      '"Add to Home Screen", then open __ASSISTANT_NAME__ from the ' +
      'new icon and tap Enable here.';

    document.getElementById('notif-btn').addEventListener('click', () => {
      const open = notifPanel.style.display !== 'none';
      notifPanel.style.display = open ? 'none' : 'block';
      if (!open) { _refreshNotifState(); _loadNotifQueue(); }
    });

    function _isIos() { return /iphone|ipad|ipod/i.test(navigator.userAgent); }
    function _isStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches
          || window.navigator.standalone === true;
    }
    function _pushSupported() {
      return 'serviceWorker' in navigator && 'PushManager' in window
          && 'Notification' in window;
    }

    function _setNotif(stateText, helpText, canEnable, canDisable) {
      notifState.textContent = stateText;
      notifHelp.textContent = helpText || '';
      notifHelp.style.display = helpText ? 'block' : 'none';
      notifOn.style.display = canEnable ? 'block' : 'none';
      notifOff.style.display = canDisable ? 'block' : 'none';
    }

    async function _refreshNotifState() {
      if (!_pushSupported()) {
        _setNotif('Notifications unavailable',
          (_isIos() && !_isStandalone())
            ? _IOS_INSTALL_HELP
            : "This browser can't receive push notifications.",
          false, false);
        return;
      }
      if (_isIos() && !_isStandalone()) {
        _setNotif('Add to Home Screen first', _IOS_INSTALL_HELP,
                  false, false);
        return;
      }
      if (Notification.permission === 'denied') {
        _setNotif('Notifications blocked',
          "Notifications are blocked for this site. Allow them in " +
          "your browser's site settings, then come back here.",
          false, false);
        return;
      }
      try {
        _swReg = _swReg || await navigator.serviceWorker.getRegistration();
        const sub = _swReg
          ? await _swReg.pushManager.getSubscription() : null;
        if (sub) {
          _setNotif('Notifications on for this device', '', false, true);
        } else if (Notification.permission === 'granted') {
          _setNotif('Permission given, not subscribed',
            'Tap Enable to finish turning notifications on for ' +
            'this device.', true, false);
        } else {
          _setNotif('Notifications off for this device', '', true, false);
        }
      } catch (e) {
        _setNotif('Notifications unavailable',
          'The notification service could not be reached on this ' +
          'device.', false, false);
      }
    }

    function _urlB64ToUint8Array(b64) {
      const pad = '='.repeat((4 - b64.length % 4) % 4);
      const base = (b64 + pad).replace(/-/g, '+').replace(/_/g, '/');
      const raw = atob(base);
      const out = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
      return out;
    }

    async function doEnableNotif() {
      try {
        const perm = await Notification.requestPermission();
        if (perm !== 'granted') { _refreshNotifState(); return; }
        const keyRes  = await _authFetch('/api/push/public-key');
        const keyBody = await keyRes.json();
        if (!keyBody.public_key) {
          _setNotif('Notifications unavailable',
            'The computer could not set up push notifications — ' +
            'the push library may not be installed there.',
            false, false);
          return;
        }
        const reg = _swReg
          || await navigator.serviceWorker.register('/sw.js');
        _swReg = reg;
        const sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: _urlB64ToUint8Array(keyBody.public_key),
        });
        await _authFetch('/api/push/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(sub.toJSON()),
        });
        toast('Notifications on');
      } catch (e) {
        sys('Could not enable notifications: ' + e.message);
      }
      _refreshNotifState();
    }

    async function doDisableNotif() {
      try {
        const reg = _swReg
          || await navigator.serviceWorker.getRegistration();
        const sub = reg
          ? await reg.pushManager.getSubscription() : null;
        if (sub) {
          await _authFetch('/api/push/unsubscribe', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ endpoint: sub.endpoint }),
          });
          await sub.unsubscribe();
        }
      } catch (e) { /* the state refresh below reports what is true */ }
      _refreshNotifState();
    }

    // ── The missed queue ──────────────────────────────────────────────
    async function _loadNotifQueue() {
      try {
        const r = await _authFetch('/api/notify/queue');
        const body = await r.json();
        _renderNotifQueue(body.items || []);
      } catch (e) { /* leave the panel and badge as they were */ }
    }

    function _renderNotifQueue(items) {
      notifBadge.textContent = items.length;
      notifBadge.style.display = items.length ? 'block' : 'none';
      notifQueue.innerHTML = '';
      if (!items.length) {
        notifQueue.innerHTML =
          '<div class="nq-empty">Nothing missed.</div>';
        return;
      }
      for (const it of items.slice().reverse()) {
        const d = document.createElement('div');
        d.className = 'nq-item';
        const when = new Date(it.ts * 1000).toLocaleString();
        d.innerHTML =
          '<div class="nq-main"><div class="nq-title"></div>' +
          '<div class="nq-body"></div><div class="nq-when">' +
          esc(when) + '</div></div>';
        d.querySelector('.nq-title').textContent = it.title;
        d.querySelector('.nq-body').textContent = it.body;
        const x = document.createElement('button');
        x.className = 'nq-x'; x.textContent = '✕'; x.title = 'Dismiss';
        x.addEventListener('click', () => _dismissNotif(it.id));
        d.appendChild(x);
        notifQueue.appendChild(d);
      }
      const clear = document.createElement('button');
      clear.className = 'btn nq-clear'; clear.textContent = 'DISMISS ALL';
      clear.addEventListener('click', () => _dismissNotif(null));
      notifQueue.appendChild(clear);
    }

    async function _dismissNotif(id) {
      try {
        await _authFetch('/api/notify/dismiss', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(id ? { id } : { all: true }),
        });
      } catch (e) { /* the reload below shows the server's truth */ }
      _loadNotifQueue();
    }

    // A notification arriving while the dashboard is open: a card in
    // the feed and the toast pill, and the missed list re-read (the
    // same delivery just joined it).
    function showNotificationCard(m) {
      const d = document.createElement('div');
      d.className = 'msg msg-notif';
      const lbl = document.createElement('div');
      lbl.className = 'lbl';
      lbl.textContent = '🔔 ' + (m.title || 'Notification');
      const body = document.createElement('div');
      body.textContent = m.body || '';
      d.appendChild(lbl); d.appendChild(body);
      feed.appendChild(d);
      feed.scrollTop = feed.scrollHeight;
      toast(m.title || 'Notification');
      _loadNotifQueue();
    }

    // Startup: register the worker (push needs it; the registration
    // is also how the state check finds an existing subscription)
    // and count what was missed while the page was away.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(r => { _swReg = r; })
        .catch(() => {});
    }
    _loadNotifQueue();
  </script>
</body>
</html>
