name: MARK LVI (ARIA) tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for headless Qt
        # PyQt6 imports libEGL/libGL even with the offscreen platform; a bare
        # ubuntu runner has neither, and every UI-touching suite would die at
        # import rather than fail on its own merits.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libglib2.0-0 \
            libfontconfig1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 \
            libportaudio2
      - name: Install dependencies
        # Unlike ARIA (whose suites stub their imports), these suites import
        # the real tree — ui.py pulls PyQt6, providers/ pulls httpx — so the
        # full requirements set is the test environment.
        run: pip install -r requirements.txt pytest ruff
      - name: Ruff — no unused imports
        run: python -m ruff check . --select F401 --exclude '__init__.py'
      - name: Test suites (pytest)
        # Each suite file runs in its OWN process so module-level state and
        # import stubs cannot leak across files (same convention as ARIA's
        # tests.yml). A failure in any file fails the job.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # A failing suite NAMES itself: on failure the step emits
          # ::error annotations (file + FAILED/ERROR lines) before
          # exiting — annotations are readable through the API,
          # while job logs need an interactive sign-in. Added
          # 2026-10-24 after three CI runs failed at this step with
          # no readable record of which file or test was responsible.
          run_suite() {
            python -m pytest "$@" -q > /tmp/pt.out 2>&1 && { tail -1 /tmp/pt.out; return 0; }
            echo "::error title=pytest failure::FAILED suite: $*"
            grep -E "^(FAILED|ERROR)" /tmp/pt.out | head -8 | while IFS= read -r line; do echo "::error title=pytest failure::$line"; done
            tail -30 /tmp/pt.out
            exit 1
          }
          run_suite tests/test_identity.py tests/test_incidents.py
          for f in tests/test_providers_selftest.py tests/test_dashboard.py tests/test_commands.py tests/test_spotify.py tests/test_files.py tests/test_selfedit.py tests/test_memory_import.py tests/test_routines.py tests/test_gmail.py tests/test_calendar.py tests/test_github.py tests/test_provider_setup.py tests/test_briefing.py tests/test_file_tools.py tests/test_journal.py tests/test_mtg.py tests/test_price_watches.py tests/test_scheduler.py tests/test_screen_watches.py tests/test_dj.py tests/test_startup_briefing.py tests/test_save_playlist.py tests/test_memory_hardening.py tests/test_semantic_recall.py tests/test_content_tabs.py tests/test_config_hardening.py tests/test_consolidation.py tests/test_confirm_banner.py tests/test_engine_failover.py tests/test_diagnostics.py tests/test_proactive_joins.py tests/test_watchdog.py tests/test_selfheal.py tests/test_backup_mirror.py tests/test_delegation.py tests/test_task_engine.py tests/test_mcp.py tests/test_mcp_degraded.py tests/test_playback.py tests/test_neuron_hud.py tests/test_wave_hud.py tests/test_remote_overlay.py tests/test_run_shell.py tests/test_notify.py tests/test_codewatch.py tests/test_fleet.py tests/test_shortcut_python.py tests/test_streams.py tests/test_power_intent.py tests/test_restart_program.py tests/test_english_only.py tests/test_plugin_foundry.py tests/test_pet_mode.py tests/test_media_plugin.py tests/test_aria_icon.py tests/test_status_plaques.py tests/test_node_hub.py tests/test_phone_node.py tests/test_presence.py tests/test_presence_toggle.py tests/test_mediacontrol.py tests/test_media_control.py; do run_suite "$f"; done
