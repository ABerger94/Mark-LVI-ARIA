name: MARK LVI (ARIA) tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for headless Qt
        # PyQt6 imports libEGL/libGL even with the offscreen platform; a bare
        # ubuntu runner has neither, and every UI-touching suite would die at
        # import rather than fail on its own merits.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libglib2.0-0 \
            libfontconfig1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 \
            libportaudio2
      - name: Install dependencies
        # Unlike ARIA (whose suites stub their imports), these suites import
        # the real tree — ui.py pulls PyQt6, providers/ pulls httpx — so the
        # full requirements set is the test environment.
        run: pip install -r requirements.txt pytest ruff
      - name: Ruff — no unused imports
        run: python -m ruff check . --select F401 --exclude '__init__.py'
      - name: Test suites (pytest)
        # Each suite file runs in its OWN process so module-level state and
        # import stubs cannot leak across files (same convention as ARIA's
        # tests.yml). A failure in any file fails the job.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/test_identity.py tests/test_incidents.py -q
          for f in tests/test_providers_selftest.py tests/test_dashboard.py tests/test_commands.py tests/test_spotify.py tests/test_files.py tests/test_selfedit.py; do python -m pytest "$f" -q || exit 1; done
